name: macOS build

# The project is developed on Windows, so this is the only machine that can
# build the Mac app. Run it by hand from the Actions tab, or let a version tag
# trigger it; the .dmg comes back as an artifact to test before anything is
# published.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build the app bundle
    runs-on: macos-14      # Apple Silicon, which is what the bundle targets
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          rustc --version
          uname -m

      - name: Test
        run: cargo test --release

      # whisper.cpp is compiled rather than downloaded - it publishes no macOS
      # command-line binary - and the model beside it is 74 MB. Both are pinned,
      # so a hit here is the same bytes a rebuild would produce, and it turns
      # several minutes of compiling into seconds.
      - name: Cache the whisper.cpp build and its model
        uses: actions/cache@v4
        with:
          path: packaging/.cache/whispercpp
          key: whispercpp-${{ runner.os }}-${{ hashFiles('packaging/macos/build_whispercpp.sh') }}

      - name: Build the .app and .dmg
        run: ./packaging/macos/build_app.sh

      - name: Check the bundled ffmpeg has what the pipeline asks for
        run: |
          FF="packaging/dist/mac/Henry's Shadowing App.app/Contents/Resources/bin/ffmpeg"
          "$FF" -hide_banner -version | head -1
          for enc in libx264 aac; do
            if "$FF" -hide_banner -encoders | grep -q " $enc "; then
              echo "ok: $enc"
            else
              echo "MISSING encoder: $enc" && exit 1
            fi
          done
          "packaging/dist/mac/Henry's Shadowing App.app/Contents/Resources/bin/yt-dlp" --version
          "packaging/dist/mac/Henry's Shadowing App.app/Contents/Resources/bin/deno" --version

      - name: Check whisper.cpp shipped, is arm64, and can transcribe
        run: |
          RES="packaging/dist/mac/Henry's Shadowing App.app/Contents/Resources"
          CLI="$RES/bin/whisper-cli"
          MODEL="$RES/models/ggml-tiny.bin"

          test -x "$CLI"   || { echo "MISSING whisper-cli"; exit 1; }
          test -f "$MODEL" || { echo "MISSING bundled model"; exit 1; }

          # An x86-64 build would still run here, under Rosetta, on the CPU -
          # and silently give up the entire reason for using whisper.cpp. Fail
          # loudly instead of shipping something merely functional.
          ARCH="$(lipo -archs "$CLI")"
          echo "whisper-cli arch: $ARCH"
          [ "$ARCH" = "arm64" ] || { echo "expected arm64"; exit 1; }

          # A runner has no GPU worth the name, so this proves the binary,
          # the model and the JSON contract - not the speed.
          "$RES/bin/ffmpeg" -hide_banner -loglevel error -f lavfi \
            -i "sine=frequency=440:duration=2" -ar 16000 -ac 1 /tmp/probe.wav
          "$CLI" -m "$MODEL" -f /tmp/probe.wav -l auto -ojf -of /tmp/probe >/dev/null 2>&1
          test -f /tmp/probe.json || { echo "no JSON produced"; exit 1; }
          python3 -c "import json,sys; json.load(open('/tmp/probe.json'))['transcription']"
          echo "ok: whisper.cpp ran and produced parseable JSON"

      - name: Check the bundle launches far enough to open a window
        run: |
          # No display on a runner, so this only proves the binary loads, links
          # and does not die on start-up - not that the UI is right.
          APP="packaging/dist/mac/Henry's Shadowing App.app/Contents/MacOS/henrys_shadowing_app"
          "$APP" &
          PID=$!
          sleep 10
          if kill -0 "$PID" 2>/dev/null; then
            echo "still running after 10s"
            kill "$PID"
          else
            wait "$PID" || echo "exited with $? - expected on a headless runner"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            packaging/dist/*.dmg
            packaging/dist/*.dmg.sha256
          if-no-files-found: error
